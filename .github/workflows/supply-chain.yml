name: Supply chain

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@v2
      # The scanners are installed with a current stable compiler: their own
      # MSRV moves faster than the workspace pin in rust-toolchain.toml.
      - run: rustup toolchain install stable --profile minimal --no-self-update
      - run: cargo +stable install --locked cargo-audit
      # Audit the committed application lockfile. `rsa` is pulled through
      # sqlx-mysql, which is not enabled; the feature-aware deny job below
      # checks the active graph without that lockfile-only false positive.
      - run: cargo audit --deny warnings --ignore RUSTSEC-2023-0071
      # Every other committed lockfile is audited too: the fuzz crate and the
      # two standalone tool crates resolve their own dependency trees.
      - name: cargo audit standalone lockfiles
        run: |
          set -euo pipefail
          for lock in \
            headscale-core/fuzz/Cargo.lock \
            tools/parity/headscale-rs/Cargo.lock \
            tools/real-client/headscale-rs-harness/Cargo.lock; do
            cargo audit --file "${lock}" --deny warnings
          done

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@v2
      - run: rustup toolchain install stable --profile minimal --no-self-update
      - run: cargo +stable install --locked cargo-deny
      - run: cargo deny check advisories licenses sources

  # Path patches (`[patch.crates-io]` -> vendor/*) bypass `cargo deny`'s
  # `[sources]` check and carry no lockfile checksum, so diff each vendored crate
  # against its pristine crates.io archive and the reviewed vendor/PATCHES.json.
  # To accept an intended vendor change run
  #   scripts/check_vendor_provenance.py --update
  # locally, review `git diff vendor/PATCHES.json` and commit it.
  vendor-provenance:
    name: vendor provenance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Provenance script unit tests
        run: python3 -m unittest discover -v -s scripts/tests -p 'test_check_vendor_provenance.py'
      - name: Vendored crates equal crates.io source plus the recorded patches
        run: python3 scripts/check_vendor_provenance.py -v
