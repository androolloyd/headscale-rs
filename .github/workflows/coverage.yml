name: Coverage

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  HEADSCALE_COVERAGE_FAIL_UNDER_LINES: "20"

jobs:
  llvm-cov:
    name: cargo llvm-cov
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-rust
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2
      # llvm-tools must match the pinned compiler; the tool itself is built
      # with a current stable compiler, whose MSRV moves faster than the pin.
      - run: rustup component add llvm-tools-preview
      - run: rustup toolchain install stable --profile minimal --no-self-update
      - run: cargo +stable install --locked cargo-llvm-cov
      - run: ./scripts/coverage.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-${{ github.run_id }}
          if-no-files-found: error
          path: target/coverage/
