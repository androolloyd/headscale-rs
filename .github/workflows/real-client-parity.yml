name: Real-client parity

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/real-client-parity.yml"
      - "scripts/check_headscale_go_refs.py"
      - "headscale-api/**"
      - "headscale-api-acl/**"
      - "headscale-cli/**"
      - "headscale-db/**"
      - "vendor/**"
      - "tools/real-client/**"
      - "tools/parity/headscale-go/**"
      - "Cargo.toml"
      - "Cargo.lock"
  pull_request:
    paths:
      - ".github/workflows/real-client-parity.yml"
      - "scripts/check_headscale_go_refs.py"
      - "headscale-api/**"
      - "headscale-api-acl/**"
      - "headscale-cli/**"
      - "headscale-db/**"
      - "vendor/**"
      - "tools/real-client/**"
      - "tools/parity/headscale-go/**"
      - "Cargo.toml"
      - "Cargo.lock"
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
    inputs:
      smokes:
        description: "Space- or comma-separated smoke IDs, or all"
        required: false
        default: "all"
      targets:
        description: "Space- or comma-separated targets: rust, headscale-go"
        required: false
        default: "rust headscale-go"
      timeout_secs:
        description: "Per-smoke timeout in seconds"
        required: false
        default: "180"

concurrency:
  group: real-client-parity-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  REAL_CLIENT_TARGETS: ${{ github.event.inputs.targets || 'rust headscale-go' }}
  REAL_CLIENT_TIMEOUT_SECS: ${{ github.event.inputs.timeout_secs || '180' }}
  TAILSCALE_IMAGE: tailscale/tailscale:v1.94.1

jobs:
  # Upstream headscale-go main moves independently of this repository. The
  # smoke job below only warns about it (`--remote`); this separate job turns a
  # stale checked-in current-head pin into a failing scheduled run without
  # stopping the smoke matrix from running.
  pin-freshness:
    name: headscale-go current-head pin freshness
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Fail when upstream main has moved past the checked-in pin
        run: python3 scripts/check_headscale_go_refs.py --remote --fail-on-stale

  paired-smokes:
    name: paired stock-client smokes
    runs-on: ubuntu-latest
    timeout-minutes: 240
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: headscale_ci
          POSTGRES_USER: headscale
          POSTGRES_PASSWORD: headscale
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U headscale -d headscale_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      HEADSCALE_DB_POSTGRES_TEST_URL: postgres://headscale:headscale@127.0.0.1:5432/headscale_ci?sslmode=disable
      PR_SMOKES: >-
        authkey,authkey-nonreusable,authkey-expired,authkey-relogin-same-user,authkey-relogin-expired,authkey-relogin-different-user,authkey-relogin-deleted,authkey-relogin-route-preserve,
        taildrop-capmap,ssh-accept-env,ping-lifecycle,postgres-authkey,postgres-authkey-nonreusable,postgres-authkey-expired,postgres-authkey-relogin-same-user,postgres-authkey-relogin-expired,
        postgres-authkey-relogin-different-user,postgres-authkey-relogin-deleted,postgres-authkey-relogin-route-preserve,postgres-taildrop-capmap,postgres-randomize-client-port,postgres-derp-private,postgres-derp-native,postgres-derp-native-websocket,postgres-derp-native-reload,postgres-derp-native-restart,
        postgres-online-lastseen,postgres-ping-lifecycle,postgres-full-map-ping-churn,postgres-ephemeral-reconnect,postgres-policy-churn,postgres-rejected-policy-filter,postgres-policy-peer-removal-restart,postgres-self-filter-user-rename,postgres-nextdns-nodeattrs-policy-reload,postgres-web-register-policy-churn,postgres-web-register-policy-churn-restart,postgres-web-register-policy-config-map-churn-restart,postgres-node-rename,postgres-invalid-fqdn-peer-restart,postgres-node-key-expiry-clear,postgres-policy-rename-restart,postgres-user-node-lifecycle-restart,postgres-magicdns,postgres-magicdns-custom-domain,postgres-extra-records,postgres-dns-disabled,
        postgres-dns-edge,postgres-dns-hot-reload,postgres-magicdns-ipv6-only,postgres-prefix-family-dual-stack,postgres-prefix-family-v4-to-dual-backfill,postgres-prefix-family-v4-to-dual-backfill-route-restart,postgres-prefix-family-v4-to-dual-backfill-magicdns-restart,postgres-prefix-family-v4-to-dual-backfill-ssh-policy-restart,postgres-prefix-family-dual-stack-to-ipv4-only-backfill,postgres-prefix-family-dual-stack-to-ipv6-only-backfill,postgres-prefix-family-ipv4-only,
        postgres-prefix-family-ipv6-only,postgres-web-register,postgres-web-register-custom-domain,postgres-web-register-tags,postgres-web-register-unowned-tag,postgres-route-advertise,postgres-route-approve,postgres-route-primary,postgres-route-primary-restart,
        postgres-route-primary-failover,postgres-route-primary-sticky,postgres-route-primary-withdraw,postgres-route-exit-node,postgres-web-register-route-approve,postgres-web-register-route-approve-restart,postgres-oidc,postgres-oidc-policy-churn,postgres-oidc-policy-churn-restart,postgres-oidc-restart,
        postgres-oidc-route-approve-restart,postgres-ssh,postgres-ssh-oidc-check,postgres-ssh-cli-check,postgres-ssh-oidc-check-period-cache,postgres-ssh-oidc-check-period-local-user,postgres-ssh-oidc-policy-restart,postgres-ssh-oidc-revocation,postgres-ssh-oidc-check-wrong-user,
        postgres-ssh-oidc-check-deny,postgres-ssh-oidc-check-cancel,postgres-ssh-accept-env,postgres-ssh-localpart,postgres-ssh-profile-variants,postgres-ssh-profile-subdomain-deny,postgres-web-register-restart,postgres-restart-persistence,postgres-tagged-preauth,
        postgres-tag-update,postgres-tag-update-invalid,postgres-tag-reauth-clear,postgres-acl-allow,postgres-acl-empty,postgres-acl-autogroup-self,postgres-route-via,postgres-route-via-same-tag,
        postgres-route-via-health,postgres-route-via-health-restart,postgres-route-via-reload,postgres-route-via-multiprefix,postgres-route-via-multiprefix-reload,postgres-route-via-restart,postgres-route-via-same-tag-restart,postgres-route-via-reload-restart,postgres-route-via-health-reload-restart,
        postgres-route-via-multiprefix-restart,postgres-route-via-multiprefix-reload-restart,postgres-route-health,postgres-route-health-reload,postgres-route-health-all-unhealthy,postgres-route-health-all-unhealthy-reload,postgres-route-health-both-offline-reconnect,postgres-route-health-restart,postgres-route-health-primary-restart,
        postgres-route-health-reload-restart,postgres-route-health-all-unhealthy-restart,postgres-route-health-all-unhealthy-reload-restart,postgres-route-health-mixed-exit,postgres-route-health-mixed-exit-reload,postgres-route-health-mixed-exit-restart,postgres-route-health-mixed-exit-reload-restart,postgres-route-health-mixed-exit-all-unhealthy,
        postgres-route-health-mixed-exit-all-unhealthy-reload,postgres-route-health-mixed-exit-all-unhealthy-restart,postgres-route-health-mixed-exit-all-unhealthy-reload-restart,web-register,web-register-route-approve,oidc,oidc-policy-churn,oidc-policy-churn-restart,
        ssh-oidc-check-period-cache,ssh-oidc-check-period-local-user,ssh-oidc-policy-restart,online-lastseen,restart-persistence,magicdns,extra-records,acl-allow,
        route-approve,route-via,route-via-health,route-via-health-restart,route-via-same-tag-restart,route-via-reload-restart,route-via-multiprefix,route-health,
        route-health-all-unhealthy,route-health-mixed-exit-reload-restart,route-health-mixed-exit-all-unhealthy-reload-restart,route-edge-current-upstream-audit,prefix-family-v4-to-dual-backfill,prefix-family-dual-stack-to-ipv4-only-backfill,prefix-family-dual-stack-to-ipv6-only-backfill,web-register-tags,
        web-register-unowned-tag,ssh-oidc-check,ssh-cli-check,ssh-localpart,ssh-profile-variants,ssh-profile-subdomain-deny,magicdns-custom-domain,dns-edge,dns-hot-reload,
        magicdns-ipv6-only,acl-empty,acl-autogroup-self,derp-private,route-via-multiprefix-reload-restart,route-health-reload-restart,tag-update-invalid
    steps:
      - uses: actions/checkout@v6
      - name: Check headscale-go reference pins
        run: python3 scripts/check_headscale_go_refs.py --remote
      - name: Select smoke set
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" || "${GITHUB_EVENT_NAME}" == "push" ]]; then
            smokes="${PR_SMOKES}"
          elif [[ "${GITHUB_EVENT_NAME}" == "schedule" ]]; then
            smokes="all"
          else
            smokes="${{ github.event.inputs.smokes || 'all' }}"
          fi
          echo "REAL_CLIENT_SMOKES=${smokes}" >> "${GITHUB_ENV}"
      - name: Validate selected matrix
        run: tools/real-client/smoke-matrix.sh --check
      - name: List selected matrix
        run: tools/real-client/smoke-matrix.sh --list-selected
      - uses: ./.github/actions/setup-rust
      - uses: actions/setup-go@v6
        with:
          go-version-file: tools/parity/headscale-go/go.mod
          cache-dependency-path: tools/parity/headscale-go/go.sum
      - uses: Swatinem/rust-cache@v2
      - name: Install smoke dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y openssl postgresql-client protobuf-compiler ruby sqlite3
      - name: Check DNS live resolver harness metadata
        run: tools/real-client/dns-live-resolver-harness-check.sh
      - name: Record initial qualification source identity
        run: >-
          python3 tools/real-client/evidence_manifest.py
          --output target/real-client/evidence-before.json
          --binary rust=target/debug/headscale
          --binary rust-harness=tools/real-client/headscale-rs-harness/target/debug/headscale-rs-real-client-harness
          --binary go=${{ runner.temp }}/headscale
          --features headscale-cli/default,postgres-sqlx
          --backends sqlite,postgres
          --allow-missing-binary
      - name: Run Postgres serve mutation and restart process suite
        run: |
          set -euo pipefail
          : "${HEADSCALE_DB_POSTGRES_TEST_URL:?Postgres process suite requires its live database URL}"
          process_log="${RUNNER_TEMP}/postgres-process-mutations.log"
          cargo test -p headscale-cli --features postgres-sqlx --test cli_process \
            serve_postgres_runtime_ -- --nocapture --test-threads=1 \
            2>&1 | tee "${process_log}"
          # Local runs may skip when no test database is configured or the
          # role cannot create an isolated database. CI must exercise each case.
          if grep -Fq 'skipping Postgres runtime smoke' "${process_log}"; then
            echo '::error::A Postgres process case skipped; all cases require a live writable database.'
            exit 1
          fi
      - name: Compare Noise OIDC register responses with pinned Go
        run: |
          set -euo pipefail
          export HEADSCALE_GO_BIN="${RUNNER_TEMP}/headscale"
          python3 tools/real-client/noise-oidc-register-response-smoke.py
          NOISE_OIDC_DATABASE=postgres python3 tools/real-client/noise-oidc-register-response-smoke.py
          NOISE_OIDC_WEBSOCKET=1 python3 tools/real-client/noise-oidc-register-response-smoke.py
          NOISE_OIDC_DATABASE=postgres NOISE_OIDC_WEBSOCKET=1 python3 tools/real-client/noise-oidc-register-response-smoke.py
          NOISE_OIDC_TLS=1 NOISE_OIDC_WEBSOCKET=1 python3 tools/real-client/noise-oidc-register-response-smoke.py
          NOISE_OIDC_DATABASE=postgres NOISE_OIDC_TLS=1 NOISE_OIDC_WEBSOCKET=1 python3 tools/real-client/noise-oidc-register-response-smoke.py
          NOISE_OIDC_DELETE_STREAM=1 python3 tools/real-client/noise-oidc-register-response-smoke.py
          NOISE_OIDC_DATABASE=postgres NOISE_OIDC_DELETE_STREAM=1 python3 tools/real-client/noise-oidc-register-response-smoke.py
      - name: Compare tagged auth-key reauthentication with pinned Go
        run: |
          set -euo pipefail
          export HEADSCALE_GO_BIN="${RUNNER_TEMP}/headscale"
          python3 tools/real-client/noise-tagged-retag-smoke.py
          NOISE_TAGGED_DATABASE=postgres python3 tools/real-client/noise-tagged-retag-smoke.py
      - name: Compare admin CLI output and requests with pinned Go
        # Successful output and request construction use deterministic gRPC
        # responses so timestamps and random secrets need no output masking.
        # The preceding paired process steps build both CLI executables.
        run: |
          set -euo pipefail
          export HEADSCALE_GO_BIN="${RUNNER_TEMP}/headscale"
          python3 tools/real-client/cli-admin-output-diff.py
      - name: Compare policy and OIDC startup with pinned Go
        run: |
          set -euo pipefail
          export HEADSCALE_GO_BIN="${RUNNER_TEMP}/headscale"
          python3 tools/real-client/startup-policy-oidc-smoke.py
          python3 tools/real-client/oidc-startup-deadline-smoke.py
      - name: Check Docker availability
        run: |
          set -euo pipefail
          docker version
          docker info
      - name: Pull stock Tailscale image
        run: docker pull "${TAILSCALE_IMAGE}"
      - name: Run paired real-client parity matrix
        run: tools/real-client/smoke-matrix.sh
      - name: Record final qualification source and binary identity
        if: always()
        run: >-
          python3 tools/real-client/evidence_manifest.py
          --output target/real-client/evidence-after.json
          --binary rust=target/debug/headscale
          --binary rust-harness=tools/real-client/headscale-rs-harness/target/debug/headscale-rs-real-client-harness
          --binary go=${{ runner.temp }}/headscale
          --features headscale-cli/default,postgres-sqlx
          --backends sqlite,postgres
          --reports target/real-client
          --compare-source target/real-client/evidence-before.json
      - name: Upload real-client logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: real-client-parity-${{ github.run_id }}
          if-no-files-found: ignore
          path: target/real-client/
