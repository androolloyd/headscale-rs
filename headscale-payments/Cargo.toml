[package]
name = "headscale-payments"
description = "Payment ledger, x402, and settlement"
# Excluded from `[workspace.members]` as of 2026-05-20; kept on disk
# because the active crates (`headscale-db`, `headscale-cli`,
# `headscale-api[full]`) still consume it via path dependency. Not
# published to crates.io. Package metadata is inlined (not
# `.workspace = true`) so the crate can be cargo-built from its own
# directory without a workspace root. See `CHANGES.md` for the
# deprecation contract — this crate is on the deletion shortlist once
# the active crates are refactored off of it.
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

# NOTE: dependency declarations were inlined (not `.workspace = true`)
# on 2026-05-20 when this crate was removed from `[workspace.members]`.
[dependencies]
tokio = { version = "1.42", features = ["full"] }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
thiserror = "2.0"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros"] }

headscale-identity = { path = "../headscale-identity" }
headscale-resources = { path = "../headscale-resources" }

# No `[lints] workspace = true` here — this crate is no longer a
# workspace member.
