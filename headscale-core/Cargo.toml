[package]
name = "headscale-core"
description = "Mesh coordination and WireGuard control plane"
# Excluded from `[workspace.members]` as of 2026-05-20; kept on disk
# because the active crates (`headscale-api`, `headscale-db`,
# `headscale-cli`) still consume it via path dependency. Not published
# to crates.io. Package metadata is inlined (not `.workspace = true`)
# so the crate can be cargo-built from its own directory without a
# workspace root. See `CHANGES.md` for the deprecation contract.
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

# NOTE: dependency declarations were inlined (not `.workspace = true`)
# on 2026-05-20 when this crate was removed from `[workspace.members]`.
# Versions match what the workspace `[workspace.dependencies]` table
# declares as of that date. If a workspace-level bump is needed, update
# both places.
[dependencies]
tokio = { version = "1.42", features = ["full"] }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
thiserror = "2.0"
rand_core = { version = "0.6.4", features = ["getrandom"] }
base64 = "0.22"
blake2 = "0.10"

headscale-identity = { path = "../headscale-identity" }

# WireGuard crypto
crypto_box = "0.9.1"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
curve25519-dalek = "4.1.3"
boringtun = "0.7.1"

# TUN device
tun = { version = "0.7", features = ["async"] }

# CIDR routing
ipnet = "2.9"

# Utilities
hex = "0.4"

# Metrics
prometheus-client = "0.22"

[dev-dependencies]
proptest = "1.4"

# No `[lints] workspace = true` here — this crate is no longer a
# workspace member. Lints fall back to cargo defaults; the crate is
# only built transitively via the active members.
