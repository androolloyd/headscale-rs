# headscale-rs CI — PR #241.
#
# Adds the lint + test gate the workspace previously had only as
# honor-system. Modeled on the octra repo's ci.yml (the canonical CI
# template across the three sibling repos: octra, octra-foundry,
# headscale-rs). Three jobs: fmt, clippy (default + wire-only), test
# (workspace + wire-only).
#
# The wire-only pass exercises `headscale-api --no-default-features`,
# which is the surface `octravpn-mesh` consumes (tailscale_wire/* with
# no boringtun-flavoured x25519). A regression here breaks the cross-
# repo path-dependency in octra; the default-features pass alone would
# not catch it.

name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: rustfmt
      - run: cargo fmt --all -- --check
      - name: cargo fmt excluded crates
        run: |
          set -euo pipefail
          for manifest in \
            headscale-core/Cargo.toml \
            headscale-identity/Cargo.toml \
            headscale-resources/Cargo.toml \
            headscale-payments/Cargo.toml; do
            cargo fmt --manifest-path "${manifest}" --all -- --check
          done
      - run: cargo fmt --manifest-path headscale-core/fuzz/Cargo.toml --all -- --check
      - run: cargo fmt --manifest-path tools/parity/headscale-rs/Cargo.toml --all -- --check
      - run: cargo fmt --manifest-path tools/real-client/headscale-rs-harness/Cargo.toml --all -- --check

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: clippy
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2
      # Workspace-wide gate. The `[workspace.lints]` block in the
      # root Cargo.toml is `warn`-level; `-D warnings` promotes it to
      # deny, matching the octra workspace CI lane.
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Wire-only build path: `headscale-api --no-default-features`
      # drops the boringtun-flavoured x25519-dalek pull. This is the
      # surface octravpn-mesh consumes; a regression here breaks the
      # cross-repo path-dependency.
      - run: cargo clippy -p headscale-api --no-default-features --tests -- -D warnings
      # Admin is intentionally opt-in, so keep its route/tests surface
      # covered explicitly instead of relying on default feature tests.
      - run: cargo clippy -p headscale-api --no-default-features --features admin --tests -- -D warnings
      # These crates are intentionally excluded from root workspace
      # membership but are still part of the repo's security surface.
      - name: cargo clippy excluded crates
        run: |
          set -euo pipefail
          for manifest in \
            headscale-core/Cargo.toml \
            headscale-identity/Cargo.toml \
            headscale-resources/Cargo.toml \
            headscale-payments/Cargo.toml; do
            cargo clippy --manifest-path "${manifest}" --all-targets -- -D warnings
          done

  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets
      - run: cargo test --workspace --all-targets
      # These crates are excluded from root workspace membership, so
      # run their unit/property tests explicitly.
      - name: cargo test excluded crates
        run: |
          set -euo pipefail
          for manifest in \
            headscale-core/Cargo.toml \
            headscale-identity/Cargo.toml \
            headscale-resources/Cargo.toml \
            headscale-payments/Cargo.toml; do
            cargo test --manifest-path "${manifest}" --all-targets
          done
      # Wire-only test run — same rationale as the wire-only clippy
      # pass above. Keeps the `default-features = false` path live.
      - run: cargo test -p headscale-api --no-default-features --lib
      # Admin-only test run — admin is not a default feature.
      - run: cargo test -p headscale-api --no-default-features --features admin --lib
      - run: cargo check --manifest-path tools/real-client/headscale-rs-harness/Cargo.toml

  fuzz:
    name: cargo fuzz 10k
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      FUZZ_RUNS: "10000"
      FUZZ_TIMEOUT_SECS: "30"
      FUZZ_RSS_LIMIT_MB: "4096"
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            headscale-core/fuzz -> target
      - run: cargo install cargo-fuzz --locked
      - name: Check fuzz corpus directories
        run: ./scripts/check_fuzz_corpus.sh
      - name: 10k run all fuzz targets
        run: ./scripts/fuzz_ci.sh
      - name: Upload fuzz failure logs and artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-ci-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            headscale-core/fuzz/logs/
            headscale-core/fuzz/artifacts/

  parity:
    name: headscale-go parity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: actions/setup-go@v6
        with:
          go-version-file: tools/parity/headscale-go/go.mod
          cache-dependency-path: tools/parity/headscale-go/go.sum
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            tools/parity/headscale-rs -> target
      - name: Pinned headscale-go v0.28 differential and golden
        run: ./scripts/headscale_go_diff.sh
      - name: Current-head Rust golden scenarios
        run: ./scripts/headscale_rs_current_head_golden.sh
