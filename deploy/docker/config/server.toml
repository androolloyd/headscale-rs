# Headscale-rs Server Configuration for Docker

[server]
listen = "0.0.0.0:8080"
server_url = "http://headscale-server:8080"
db_path = "/var/lib/headscale/db.sqlite"
mesh_cidr = "100.64.0.0/10"
unix_socket = "/var/lib/headscale/headscale.sock"

[noise]
private_key_path = "/var/lib/headscale/noise_private.key"

[database]
type = "sqlite"

[dns]
magic_dns = false
override_local_dns = false

# Add DERP servers as needed
# [[server.derp_servers]]
# name = "derp1"
# hostname = "derp.example.com"
# region = "us-west"
# stun_enabled = true

# SSH forwarding permissions sent to Tailscale clients on SSH rules. All three
# default to true, matching headscale-go. Set one to false to stop this server
# authorising that kind of forwarding (see docs/HARDENING.md; this does not
# patch tailscaled).
# [policy.ssh]
# allow_agent_forwarding = false
# allow_local_port_forwarding = false
# allow_remote_port_forwarding = false

[logging]
level = "info"
format = "pretty"
