[workspace]
resolver = "2"
# Only the three "active" crates participate in workspace-wide cargo
# commands (`cargo build --workspace`, `cargo test --workspace`,
# `cargo clippy --workspace`). The other four crates
# (`headscale-core`, `headscale-identity`, `headscale-resources`,
# `headscale-payments`) remain on disk and are still consumed as path
# dependencies of the active crates — they will still compile when the
# active crates compile — but they are no longer first-class workspace
# members and so won't be lint-gated or test-run on their own. See
# `CHANGES.md` (2026-05-20) and the per-crate README notes.
members = [
    "headscale-api",
    "headscale-api-acl",
    "headscale-db",
    "headscale-cli",
]
exclude = [
    "headscale-core/fuzz",
    # Kept on disk but excluded from workspace-wide cargo commands.
    "headscale-core",
    "headscale-identity",
    "headscale-resources",
    "headscale-payments",
]

[workspace.lints.clippy]
# Mirrors octra/Cargo.toml + octra-foundry/Cargo.toml at the
# same level of strictness — `all + pedantic + nursery` at warn,
# enforced via `-D warnings` on CI. PR #241 added this block; the
# headscale-rs workspace previously had no lints config and shipped
# ~6k LOC of new tailscale_wire/* code with default-clippy as the
# only gate.
all              = { level = "warn", priority = -1 }
pedantic         = { level = "warn", priority = -1 }
nursery          = { level = "warn", priority = -1 }
# Pragmatic relaxations — copied verbatim from the octra workspace
# so the three repos agree on what's a real signal vs noise.
module_name_repetitions = "allow"
must_use_candidate      = "allow"
missing_errors_doc      = "allow"
missing_panics_doc      = "allow"
multiple_crate_versions = "allow"
similar_names           = "allow"
too_many_lines          = "allow"
cast_possible_truncation = "allow"
cast_sign_loss          = "allow"
cast_lossless           = "allow"
cast_possible_wrap      = "allow"
items_after_statements  = "allow"
significant_drop_tightening = "allow"
significant_drop_in_scrutinee = "allow"
unused_async            = "allow"
future_not_send         = "allow"
return_self_not_must_use = "allow"
missing_const_for_fn    = "allow"
struct_excessive_bools  = "allow"
struct_field_names      = "allow"
redundant_pub_crate     = "allow"
option_if_let_else      = "allow"
or_fun_call             = "allow"
unwrap_used             = "allow"
cognitive_complexity    = "allow"
too_many_arguments      = "allow"
doc_markdown            = "allow"
doc_overindented_list_items = "allow"
too_long_first_doc_paragraph = "allow"
# Headscale-rs-specific relaxations. PR #241-followup cleanup landed the
# bulk of these inline; the survivors below all fire inside the three
# tailscale_wire files (`wire.rs`, `map.rs`, `register.rs`) that are
# frozen by Wall 7 — we can't add per-site `#[allow]` without touching
# the worktree-frozen files. Drop these when the wire layer reopens.
result_large_err        = "allow"  # map.rs:46 / register.rs:39 — Response error variant is 128 B; boxing requires touching the wire layer.
useless_let_if_seq      = "allow"  # map.rs:201 — `record_changed` set across two `if` branches; the rewrite needs a wire-file edit.
trivially_copy_pass_by_ref = "allow"  # wire.rs:503/506 — `is_zero_u16/i32` are serde skip predicates; ABI matches `serde(skip_serializing_if)`.

[workspace.lints.rust]
unsafe_code             = "deny"
unused_must_use         = "deny"
trivial_numeric_casts   = "warn"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["headscale-rs contributors"]

[workspace.dependencies]
# Async runtime
tokio = { version = "1.42", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Crypto
ed25519-dalek = "2.2"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
curve25519-dalek = "4.1.3"
blake2 = "0.10"
rand_core = { version = "0.6.4", features = ["getrandom"] }
bs58 = "0.5"
multibase = "0.9"
base64 = "0.22"

# Networking
tonic = "0.14"
prost = "0.14"
axum = "0.8"

# Database
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros"] }

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Metrics
prometheus-client = "0.22"
once_cell = "1.20"

# Timestamps — UTC `DateTime`s for machine lifecycle (expiry / last_seen /
# created_at). Matches upstream `juanfont/headscale`'s use of
# `gorm.DeletedAt` + `time.Time` on the `Node` model.
chrono = { version = "0.4", default-features = false, features = ["serde", "clock", "std"] }

# Internal crates
headscale-core = { path = "headscale-core" }
headscale-identity = { path = "headscale-identity" }
headscale-resources = { path = "headscale-resources" }
headscale-payments = { path = "headscale-payments" }
headscale-api = { path = "headscale-api" }
headscale-api-acl = { path = "headscale-api-acl" }
headscale-db = { path = "headscale-db" }
headscale-cli = { path = "headscale-cli" }

# CLI
clap = { version = "4.5", features = ["derive", "env"] }
toml = "0.8"
hostname = "0.3"
local-ip-address = "0.6"
