name: Supply chain

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-audit
      - run: cargo generate-lockfile
      # `cargo audit` is lockfile-only and currently reports
      # RUSTSEC-2023-0071 through sqlx's optional MySQL backend even
      # though this workspace enables only sqlite. The feature-aware
      # `cargo deny check advisories` job below remains authoritative
      # for the active dependency graph.
      - run: cargo audit --deny warnings --ignore RUSTSEC-2023-0071
      - run: cargo audit --file headscale-core/fuzz/Cargo.lock --deny warnings

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-deny
      - run: cargo deny check advisories licenses sources
