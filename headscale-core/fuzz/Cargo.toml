[package]
name = "headscale-core-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

# Isolate from parent workspace
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
tokio = { version = "1.42", features = ["rt"] }
ipnet = "2.9"
serde = "1"
serde_json = "1"

[dependencies.headscale-core]
path = ".."

[dependencies.headscale-api-acl]
path = "../../headscale-api-acl"

[dependencies.headscale-api]
path = "../../headscale-api"
default-features = false

[dependencies.boringtun]
version = "0.7.1"

# STUN parsing fuzz target
[[bin]]
name = "fuzz_stun"
path = "fuzz_targets/fuzz_stun.rs"
test = false
doc = false
bench = false

# DERP parsing fuzz target
[[bin]]
name = "fuzz_derp"
path = "fuzz_targets/fuzz_derp.rs"
test = false
doc = false
bench = false

# IP packet parsing fuzz target
[[bin]]
name = "fuzz_ip_packet"
path = "fuzz_targets/fuzz_ip_packet.rs"
test = false
doc = false
bench = false

# WireGuard packet parsing fuzz target
[[bin]]
