[package]
name = "headscale-cli"
description = "CLI for headscale-rs mesh networking"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "headscale_cli"
path = "src/lib.rs"

[[bin]]
name = "headscale"
path = "src/main.rs"

[dependencies]
tokio.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
anyhow.workspace = true
thiserror.workspace = true
chrono.workspace = true
axum = "0.7"
sqlx = { workspace = true, features = ["runtime-tokio", "sqlite"] }
tonic = { workspace = true, features = ["tls-native-roots"] }
prost-types = "0.14"
tokio-stream = { version = "0.1", features = ["net"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tower = { version = "0.5", features = ["util"] }

headscale-core = { workspace = true }
# The admin subcommands (users / nodes / preauthkeys / policy / tailnet)
# only need the type definitions exported under the `admin` feature.
# The full `default` set (gateway / gRPC / Server) is also enabled
# because the existing `headscale server` / `headscale node`
# subcommands still depend on `headscale_api::Server`. Once the gateway
# WIP lands and those subcommands are refactored, the `full` feature
# can be dropped here — the admin client surface itself never touches it.
headscale-api = { path = "../headscale-api", default-features = false, features = ["admin", "full"] }
headscale-identity = { workspace = true }
headscale-payments = { workspace = true }
headscale-resources = { workspace = true }
headscale-db = { workspace = true }

# CLI argument parsing
clap = { workspace = true }
clap_complete = { workspace = true }

# Config file support
toml = { workspace = true }
serde_yaml = { workspace = true }
hex = "0.4"
rand_core = { workspace = true }
url = "2"

# HTTP client for node mode + admin API client.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
jsonwebtoken = { version = "9", default-features = false, features = ["use_pem"] }
sha2 = "0.10"
serde_urlencoded = "0.7"
instant-acme = { version = "0.8.5", default-features = false, features = ["aws-lc-rs", "hyper-rustls", "rcgen"] }

# Local endpoint discovery
hostname = { workspace = true }
local-ip-address = { workspace = true }

[dev-dependencies]
# Mock HTTP server for the admin client unit tests. Keep this on the
# maintained series so supply-chain checks do not inherit old
# async-std-based test-only transitive deps.
async-trait.workspace = true
httpmock = "0.8"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "service", "http1"] }
rcgen = { version = "0.13", default-features = false, features = ["pem", "crypto", "aws_lc_rs", "x509-parser"] }
rustls-pki-types = "1"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tempfile = "3"
tonic-reflection = "0.14"

[lints]
workspace = true
