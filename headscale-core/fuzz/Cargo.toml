path = "fuzz_targets/fuzz_endpoint.rs"
test = false
doc = false
bench = false

# ACL policy parsing fuzz target
[[bin]]
name = "fuzz_acl"
path = "fuzz_targets/fuzz_acl.rs"
test = false
doc = false
bench = false

# Transport message parsing fuzz target
[[bin]]
name = "fuzz_transport"
path = "fuzz_targets/fuzz_transport.rs"
test = false
doc = false
bench = false

# Metering session fuzz target
[[bin]]
name = "fuzz_metering"
path = "fuzz_targets/fuzz_metering.rs"
test = false
doc = false
bench = false

# Routing table fuzz target
