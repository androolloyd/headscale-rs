[package]
name = "headscale-api"
description = "gRPC/HTTP control plane API"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["full", "admin"]
# Enables the HTTP gateway / gRPC / server modules + the sibling-crate
# deps they need (`headscale-core`, `headscale-identity`,
# `headscale-resources`, `headscale-payments`). Downstream callers
# that only want the Tailscale wire-protocol surface
# (`tailscale_wire::router`, `WireState`, traits) can disable the
# default feature with `default-features = false` and avoid pulling
# in the boringtun-flavoured x25519-dalek that those crates carry.
# That escape hatch is what `octravpn-mesh` uses — it depends only on
# the wire layer, not the full headscale control plane.
full = [
    "dep:headscale-core",
    "dep:headscale-identity",
    "dep:headscale-resources",
    "dep:headscale-payments",
    "dep:tonic",
    "dep:prost",
    "dep:reqwest",
    "dep:futures",
]
# Admin GUI v0 — `admin::router()` returns an axum Router with
# server-side rendered HTML (maud) + JSON API. Default-on; downstream
# crates can disable it with `default-features = false` to skip the
# maud dep entirely.
admin = [
    "dep:maud",
    # `hmac` + `sha2` are non-optional now (the knock layer needs them
    # outside the admin gate); admin shares the same crates without a
    # separate dep activation.
    "dep:serde_urlencoded",
    "dep:rand_core",
    "dep:headscale-db",
    "dep:sqlx",
]

[dependencies]
tokio.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
thiserror.workspace = true
axum = "0.7"
tonic = { workspace = true, optional = true }
prost = { workspace = true, optional = true }

headscale-core = { workspace = true, optional = true }
headscale-identity = { workspace = true, optional = true }
headscale-resources = { workspace = true, optional = true }
headscale-payments = { workspace = true, optional = true }
# Persistent preauth-key store — sqlx-backed, bcrypt-hashed. Lives
# behind the `admin` feature because today only the admin module
# touches it; the wire layer continues to talk to whatever
# `PreauthRedeemer` the embedder injects.
headscale-db = { workspace = true, optional = true }
# Re-exposed at workspace level so the persistent admin store can
# share the same SqlitePool as the embedder.
sqlx = { workspace = true, optional = true, features = ["runtime-tokio", "sqlite"] }

# Gateway dependencies (only when `full` is on; otherwise the wire
# layer doesn't need them).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
tower = { version = "0.5", features = ["util"] }
futures = { version = "0.3", optional = true }

# Knock layer (PSK-gated handshake; `tailscale_wire::knock`). Lives in
# the wire-default feature set because every wire-layer embedder gets
# the knock middleware whether or not they enable the admin GUI. The
# admin feature reuses the same `hmac` + `sha2` crates (see the
# `admin` feature block above — it forces the `dep:` activations even
# when downstream callers disable `default-features`).
hmac = "0.12"
sha2 = "0.10"

# Tailscale wire-protocol layer (migrated from
# octravpn-mesh::tailscale_wire 2026-05-19). The Noise IK handshake
# (`tailscale_wire::noise`) is pinned to snow 0.9 per the upstream
# OctraVPN blocker doc. The `risky-raw-split` feature exposes
# `HandshakeState::dangerously_get_raw_split()`, which we need to
# extract the two ChaCha20Poly1305 keys after the IK handshake so the
# post-handshake transport (`tailscale_wire::be_transport`) can encrypt
# records with Tailscale's big-endian nonce convention. The Noise
# spec mandates little-endian; Tailscale deviates. snow follows spec,
# so we own the transport phase. See
# `docs/tailscale-interop-blocker.md` "Wall 4" entry for the citation
# to upstream `tailscale/control/controlbase/conn.go::nonce`.
snow = { version = "0.9.6", features = ["risky-raw-split"] }
# Post-handshake transport AEAD. We use the audited
# `chacha20poly1305` crate directly (NOT any custom cipher math) and
# only deviate from the Noise spec in the nonce-encoding step. Same
# crate version OctraVPN already uses workspace-wide for the WG
# throughput bench.
chacha20poly1305 = "0.10"
# `/ts2021` HTTP/2 server over the Noise-wrapped hijacked socket.
h2 = "0.4"
# Hyper supplies `hyper::upgrade::OnUpgrade` (placed in request
# extensions for `Upgrade:` requests) + the `http`/`bytes` types
# traded with h2.
hyper = { version = "1", features = ["http1", "server"] }
# `TokioIo` wraps `hyper::upgrade::Upgraded` into a tokio
# AsyncRead+AsyncWrite — feeds the hijacked socket into the Framed
# controlbase reader. The `server` feature is consumed by
# `tailscale_wire::raw_tls` when it serves the non-/ts2021 traffic
# through hyper directly (skipping axum-server / hyper-rustls on :443).
hyper-util = { version = "0.1", features = ["tokio", "server", "service", "http1"] }
# Async futures combinators used in the controlbase framing reader
# and the `/map` Stream:true keepalive emitter.
futures-util = "0.3"
# Body-frame plumbing. `http-body` exposes `Body::poll_frame`, which
# is what `dispatch_h2_request` uses to forward streaming response
# bodies frame-by-frame onto the h2 SendResponse (closing Wall 5 from
# `docs/tailscale-interop-blocker.md`: the prior `BodyExt::collect`
# call blocked forever on the long-poll `/machine/map` body).
# `http-body-util` is kept for the tests that buffer small bodies
# via `BodyExt::collect`.
http-body = "1"
http-body-util = "0.1"
http = "1"
parking_lot = "0.12"
bytes = "1"
hex = "0.4"
# `tailscale_wire::raw_tls` decodes the `X-Tailscale-Handshake` request
# header (StdEncoding base64 — the entire controlbase-framed Initiation
# frame). Stock Tailscale clients v1.42+ ship the Initiation in the
# header to save an RTT; without this dep we'd block forever waiting
# for a body-pipelined Initiation that never arrives.
base64 = "0.22"
# Streaming `/machine/map` response framing — see
# `docs/tailscale-interop-blocker.md` "Wall 5" for the discovery.
# Stock `tailscale` reads MapResponse bytes via
# `binary.LittleEndian.Uint32(siz[:4])` then
# `zstdframe.AppendDecode(...)` (in
# `tailscale/control/controlclient/direct.go::decodeMsg`). The wire is
# length-prefixed zstd-compressed JSON, NOT newline-delimited. We use
# the `zstd` crate's frame-mode encoder (`zstd::bulk::compress`) so
# our output is byte-compatible with klauspost's `zstdframe` package
# that upstream consumes.
zstd = { version = "0.13", default-features = false }
# `tailscale_wire::map::control_time_now` formats the server clock as
# RFC3339-nano for `MapResponse.ControlTime`. We pick `time` (not
# `chrono`) because it's already in the workspace's transitive graph
# via the auth / session layers, and its `well_known::Rfc3339`
# description matches Go's `time.RFC3339Nano` byte-for-byte for the
# fractional-seconds suffix.
time = { version = "0.3", default-features = false, features = ["formatting", "parsing"] }

# Admin GUI v0 deps — only pulled in when the `admin` feature is on
# (default). `maud` is the type-safe HTML template engine; `hmac` +
# `sha2` back the session-cookie + CSRF tokens; `serde_urlencoded`
# parses `application/x-www-form-urlencoded` POST bodies; `rand_core`
# (with the `getrandom` feature, set at workspace level) seeds the
# per-process HMAC secret + the preauth token raw bytes. All four
# already live in the transitive dep tree, so this adds zero net
# crates to the build graph — only their `dep:` activation.
maud = { version = "0.27", features = ["axum"], optional = true }
# `hmac` + `sha2` are now non-optional (declared above) because the
# knock layer (`tailscale_wire::knock`) needs them in the wire-default
# feature set. Listing them here would shadow that.
serde_urlencoded = { version = "0.7", optional = true }
rand_core = { workspace = true, optional = true }

# TLS termination on :443 — required by stock `tailscale up` v1.78+
# which forces an HTTPS-on-443 dial after the initial /key probe.
# `rcgen` mints the self-signed cert at startup (cached under
# `<state_dir>/tls.{crt,key}`); `axum-server` is the rustls bridge for
# axum 0.7. `rustls-pemfile` parses the cached PEM back into rustls
# Cert/Key types. Both new in this PR.
#
# `tokio-rustls` is the raw-acceptor side used by the parallel
# /ts2021 listener (`tailscale_wire::raw_tls`) — see the module doc
# for why we bypass axum-server on :443. Pinned to the same rustls
# minor as above (0.23 ↔ tokio-rustls 0.26).
rcgen = { version = "0.13", default-features = false, features = ["pem", "crypto", "aws_lc_rs"] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }
rustls-pemfile = "2"
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs"] }

[build-dependencies]
tonic-build = "0.12"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
futures = "0.3"
# `tempfile::tempdir` for the wire module's per-test
# ServerNoiseKey fixtures.
tempfile = "3"
# Admin GUI unit tests use `tower::ServiceExt::oneshot` to drive the
# axum Router without binding a socket.
tower = { version = "0.5", features = ["util"] }
# Admin GUI tests parse JSON responses from the `/api/v1/*` surface.
serde_json = { workspace = true }
# Admin GUI integration test crate uses `hex` to build a fixture
# node-key hex string.
hex = "0.4"

[lints]
workspace = true
