version: "3.9"

services:
  # Control plane server
  headscale-server:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    container_name: headscale-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./config/server.toml:/etc/headscale/config.toml:ro
      - headscale-data:/var/lib/headscale
    environment:
      - RUST_LOG=info
      - HEADSCALE_LOG=info
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Example mesh node (optional - for testing)
  headscale-node:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.node
    container_name: headscale-node
    restart: unless-stopped
    depends_on:
      headscale-server:
        condition: service_healthy
    volumes:
      - ./config/node.toml:/etc/headscale/config.toml:ro
      - node-data:/var/lib/headscale
    environment:
      - RUST_LOG=info
      - HEADSCALE_LOG=info
      - HEADSCALE_SERVER=http://headscale-server:8080
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv6.conf.all.forwarding=1
    # Optional: Use host network for full mesh connectivity
    # network_mode: host

volumes:
  headscale-data:
  node-data:

networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
