name: Real-client parity

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/real-client-parity.yml"
      - "scripts/check_headscale_go_refs.py"
      - "headscale-api/**"
      - "headscale-api-acl/**"
      - "headscale-cli/**"
      - "headscale-db/**"
      - "tools/real-client/**"
      - "tools/parity/headscale-go/**"
      - "Cargo.toml"
      - "Cargo.lock"
  pull_request:
    paths:
      - ".github/workflows/real-client-parity.yml"
      - "scripts/check_headscale_go_refs.py"
      - "headscale-api/**"
      - "headscale-api-acl/**"
      - "headscale-cli/**"
      - "headscale-db/**"
      - "tools/real-client/**"
      - "tools/parity/headscale-go/**"
      - "Cargo.toml"
      - "Cargo.lock"
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
    inputs:
      smokes:
        description: "Space- or comma-separated smoke IDs, or all"
        required: false
        default: "all"
      targets:
        description: "Space- or comma-separated targets: rust, headscale-go"
        required: false
        default: "rust headscale-go"
      timeout_secs:
        description: "Per-smoke timeout in seconds"
        required: false
        default: "180"

concurrency:
  group: real-client-parity-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  REAL_CLIENT_TARGETS: ${{ github.event.inputs.targets || 'rust headscale-go' }}
  REAL_CLIENT_TIMEOUT_SECS: ${{ github.event.inputs.timeout_secs || '180' }}
  TAILSCALE_IMAGE: tailscale/tailscale:v1.94.1

jobs:
  paired-smokes:
    name: paired stock-client smokes
    runs-on: ubuntu-latest
    timeout-minutes: 240
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: headscale_ci
          POSTGRES_USER: headscale
          POSTGRES_PASSWORD: headscale
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U headscale -d headscale_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      HEADSCALE_DB_POSTGRES_TEST_URL: postgres://headscale:headscale@127.0.0.1:5432/headscale_ci?sslmode=disable
      PR_SMOKES: >-
        authkey,authkey-nonreusable,authkey-expired,authkey-relogin-same-user,authkey-relogin-expired,authkey-relogin-different-user,authkey-relogin-deleted,authkey-relogin-route-preserve,
        taildrop-capmap,ssh-accept-env,ping-lifecycle,postgres-authkey,postgres-authkey-nonreusable,postgres-authkey-expired,postgres-authkey-relogin-same-user,postgres-authkey-relogin-expired,
        postgres-authkey-relogin-different-user,postgres-authkey-relogin-deleted,postgres-authkey-relogin-route-preserve,postgres-taildrop-capmap,postgres-randomize-client-port,postgres-derp-private,postgres-derp-native,postgres-derp-native-reload,postgres-derp-native-restart,
        postgres-online-lastseen,postgres-ping-lifecycle,postgres-policy-churn,postgres-web-register-policy-churn,postgres-web-register-policy-churn-restart,postgres-node-rename,postgres-policy-rename-restart,postgres-magicdns,postgres-magicdns-custom-domain,postgres-extra-records,postgres-dns-disabled,
        postgres-dns-edge,postgres-dns-hot-reload,postgres-magicdns-ipv6-only,postgres-prefix-family-dual-stack,postgres-prefix-family-v4-to-dual-backfill,postgres-prefix-family-dual-stack-to-ipv4-only-backfill,postgres-prefix-family-dual-stack-to-ipv6-only-backfill,postgres-prefix-family-ipv4-only,
        postgres-prefix-family-ipv6-only,postgres-web-register,postgres-web-register-custom-domain,postgres-web-register-tags,postgres-web-register-unowned-tag,postgres-route-advertise,postgres-route-approve,postgres-route-primary,postgres-route-primary-restart,
        postgres-route-primary-failover,postgres-route-primary-sticky,postgres-route-primary-withdraw,postgres-route-exit-node,postgres-web-register-route-approve,postgres-web-register-route-approve-restart,postgres-oidc,postgres-oidc-policy-churn-restart,postgres-oidc-restart,
        postgres-oidc-route-approve-restart,postgres-ssh,postgres-ssh-oidc-check,postgres-ssh-cli-check,postgres-ssh-oidc-check-period-cache,postgres-ssh-oidc-check-period-local-user,postgres-ssh-oidc-policy-restart,postgres-ssh-oidc-check-wrong-user,
        postgres-ssh-oidc-check-deny,postgres-ssh-oidc-check-cancel,postgres-ssh-accept-env,postgres-ssh-localpart,postgres-ssh-profile-variants,postgres-ssh-profile-subdomain-deny,postgres-web-register-restart,postgres-restart-persistence,postgres-tagged-preauth,
        postgres-tag-update,postgres-tag-update-invalid,postgres-tag-reauth-clear,postgres-acl-allow,postgres-acl-empty,postgres-acl-autogroup-self,postgres-route-via,postgres-route-via-same-tag,
        postgres-route-via-health,postgres-route-via-health-restart,postgres-route-via-reload,postgres-route-via-multiprefix,postgres-route-via-multiprefix-reload,postgres-route-via-restart,postgres-route-via-same-tag-restart,postgres-route-via-reload-restart,
        postgres-route-via-multiprefix-restart,postgres-route-via-multiprefix-reload-restart,postgres-route-health,postgres-route-health-reload,postgres-route-health-all-unhealthy,postgres-route-health-all-unhealthy-reload,postgres-route-health-restart,postgres-route-health-primary-restart,
        postgres-route-health-reload-restart,postgres-route-health-all-unhealthy-restart,postgres-route-health-all-unhealthy-reload-restart,postgres-route-health-mixed-exit,postgres-route-health-mixed-exit-reload,postgres-route-health-mixed-exit-restart,postgres-route-health-mixed-exit-reload-restart,postgres-route-health-mixed-exit-all-unhealthy,
        postgres-route-health-mixed-exit-all-unhealthy-reload,postgres-route-health-mixed-exit-all-unhealthy-restart,postgres-route-health-mixed-exit-all-unhealthy-reload-restart,web-register,web-register-route-approve,oidc,oidc-policy-churn,oidc-policy-churn-restart,
        ssh-oidc-check-period-cache,ssh-oidc-check-period-local-user,ssh-oidc-policy-restart,online-lastseen,restart-persistence,magicdns,extra-records,acl-allow,
        route-approve,route-via,route-via-health,route-via-health-restart,route-via-same-tag-restart,route-via-reload-restart,route-via-multiprefix,route-health,
        route-health-all-unhealthy,route-health-mixed-exit-reload-restart,route-health-mixed-exit-all-unhealthy-reload-restart,route-edge-current-upstream-audit,prefix-family-v4-to-dual-backfill,prefix-family-dual-stack-to-ipv4-only-backfill,prefix-family-dual-stack-to-ipv6-only-backfill,web-register-tags,
        web-register-unowned-tag,ssh-oidc-check,ssh-cli-check,ssh-localpart,ssh-profile-variants,ssh-profile-subdomain-deny,magicdns-custom-domain,dns-edge,dns-hot-reload,
        magicdns-ipv6-only,acl-empty,acl-autogroup-self,derp-private,route-via-multiprefix-reload-restart,route-health-reload-restart,tag-update-invalid
    steps:
      - uses: actions/checkout@v6
      - name: Check headscale-go reference pins
        run: python3 scripts/check_headscale_go_refs.py --remote
      - name: Select smoke set
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" || "${GITHUB_EVENT_NAME}" == "push" ]]; then
            smokes="${PR_SMOKES}"
          elif [[ "${GITHUB_EVENT_NAME}" == "schedule" ]]; then
            smokes="all"
          else
            smokes="${{ github.event.inputs.smokes || 'all' }}"
          fi
          echo "REAL_CLIENT_SMOKES=${smokes}" >> "${GITHUB_ENV}"
      - name: Validate selected matrix
        run: tools/real-client/smoke-matrix.sh --check
      - name: List selected matrix
        run: tools/real-client/smoke-matrix.sh --list-selected
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: actions/setup-go@v6
        with:
          go-version-file: tools/parity/headscale-go/go.mod
          cache-dependency-path: tools/parity/headscale-go/go.sum
      - uses: Swatinem/rust-cache@v2
      - name: Install smoke dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y openssl postgresql-client protobuf-compiler ruby sqlite3
      - name: Run Postgres serve topology smoke
        run: >-
          cargo test -p headscale-cli --features postgres-sqlx --test cli_process
          serve_postgres_runtime_local_grpc_admin_surface_smoke -- --nocapture
      - name: Check Docker availability
        run: |
          set -euo pipefail
          docker version
          docker info
      - name: Pull stock Tailscale image
        run: docker pull "${TAILSCALE_IMAGE}"
      - name: Run paired real-client parity matrix
        run: tools/real-client/smoke-matrix.sh
      - name: Upload real-client logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: real-client-parity-${{ github.run_id }}
          if-no-files-found: ignore
          path: target/real-client/
