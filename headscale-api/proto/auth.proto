syntax = "proto3";

package headscale.v1;

import "node.proto";

message AuthRegisterRequest {
  string user = 1;
  string auth_id = 2;
}

message AuthRegisterResponse {
  Node node = 1;
}

message AuthApproveRequest {
  string auth_id = 1;
}

message AuthApproveResponse {}

message AuthRejectRequest {
  string auth_id = 1;
}

message AuthRejectResponse {}
