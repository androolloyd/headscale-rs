name: Nightly fuzz

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      max_total_time:
        description: "Seconds to run each fuzz target"
        required: false
        default: "900"
      rss_limit_mb:
        description: "libFuzzer RSS limit in MiB"
        required: false
        default: "4096"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  targets:
    name: discover fuzz targets
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
      - id: targets
        run: |
          set -euo pipefail
          matrix="$(python3 scripts/fuzz_targets.py --matrix)"
          printf 'matrix=%s\n' "${matrix}" >> "${GITHUB_OUTPUT}"

  fuzz:
    name: ${{ matrix.target }}
    needs: targets
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.targets.outputs.matrix) }}
    env:
      CARGO_FUZZ_INSTALL_TOOLCHAIN: "1.95.0"
      CARGO_FUZZ_VERSION: "0.13.1"
      FUZZ_TARGET: ${{ matrix.target }}
      FUZZ_MAX_TOTAL_TIME: ${{ github.event.inputs.max_total_time || '900' }}
      FUZZ_TIMEOUT_SECS: "30"
      FUZZ_RSS_LIMIT_MB: ${{ github.event.inputs.rss_limit_mb || '4096' }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            headscale-core/fuzz -> target
      # cargo-fuzz v0.13.1's locked rustix dependency does not compile on
      # nightly 1.96; compile only the driver with pinned stable Rust.
      - name: Install cargo-fuzz
        run: |
          rustup toolchain install "${CARGO_FUZZ_INSTALL_TOOLCHAIN}" --profile minimal
          cargo "+${CARGO_FUZZ_INSTALL_TOOLCHAIN}" install cargo-fuzz --version "${CARGO_FUZZ_VERSION}" --locked
      - name: Check fuzz corpus directories
        run: ./scripts/check_fuzz_corpus.sh
      - name: Run fuzz target
        run: ./scripts/fuzz_ci.sh
      - name: Upload fuzz logs and artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-${{ matrix.target }}-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            headscale-core/fuzz/logs/${{ matrix.target }}/
            headscale-core/fuzz/artifacts/${{ matrix.target }}/
