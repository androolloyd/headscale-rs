[workspace]
resolver = "2"
members = [
    "headscale-core",
    "headscale-identity",
    "headscale-resources",
    "headscale-payments",
    "headscale-api",
    "headscale-db",
    "headscale-cli",
]
exclude = [
    "headscale-core/fuzz",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["headscale-rs contributors"]

[workspace.dependencies]
# Async runtime
tokio = { version = "1.42", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Crypto
ed25519-dalek = "=2.0.0-rc.3"
x25519-dalek = { version = "=2.0.0-rc.3", features = ["static_secrets"] }
curve25519-dalek = "=4.0.0-rc.3"
blake2 = "0.10"
rand_core = { version = "0.6.4", features = ["getrandom"] }
bs58 = "0.5"
multibase = "0.9"
base64 = "0.22"

# Networking
tonic = "0.12"
prost = "0.13"
axum = "0.8"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Metrics
prometheus-client = "0.22"
once_cell = "1.20"

# Internal crates
headscale-core = { path = "headscale-core" }
headscale-identity = { path = "headscale-identity" }
headscale-resources = { path = "headscale-resources" }
headscale-payments = { path = "headscale-payments" }
headscale-api = { path = "headscale-api" }
headscale-db = { path = "headscale-db" }
headscale-cli = { path = "headscale-cli" }

# CLI
clap = { version = "4.5", features = ["derive", "env"] }
toml = "0.8"
hostname = "0.3"
local-ip-address = "0.6"
